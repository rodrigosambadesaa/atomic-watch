          package com.rodrigosambade.atomicwatch;

          import android.os.SystemClock;

          final class AtomicClockModel {
              private boolean calibrated;
              private long anchorEpochMs;
              private long anchorElapsedRealtimeNanos;

              void calibrate(long epochAtReceiveMs, long receiveElapsedRealtimeNanos) {
                  calibrated = true;
                  anchorEpochMs = epochAtReceiveMs;
                  anchorElapsedRealtimeNanos = receiveElapsedRealtimeNanos;
              }

              boolean isCalibrated() {
                  return calibrated;
              }

              long nowMs() {
                  if (!calibrated) return System.currentTimeMillis();
                  long deltaNanos = SystemClock.elapsedRealtimeNanos() - anchorElapsedRealtimeNanos;
                  return anchorEpochMs + deltaNanos / 1_000_000L;
              }
          }
