name: Bootstrap Atomic Watch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout verified Android template
        uses: actions/checkout@v4
        with:
          repository: rodrigosambadesaa/noticias-eldiario
          ref: ad00b6616ff673a96042925f42b7f9dc2adcaf7d
          path: template

      - name: Generate Atomic Watch app
        shell: bash
        env:
          GIST_REV: ce7bd07ed17d10d48785a0c21527c8100ea6da7e
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='.github' template/ target/

          rm -rf target/app/src/main/java target/app/src/main/res/layout target/app/src/main/res/values target/app/src/main/res/drawable
          mkdir -p target/app/src/main/java/com/rodrigosambade/atomicwatch
          mkdir -p target/app/src/main/java/net/i2p/android/router/util
          mkdir -p target/app/src/main/res/layout target/app/src/main/res/values target/app/src/main/res/drawable

          rm -rf target/third_party/connectivity
          git clone --quiet https://gist.github.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f.git target/third_party/connectivity
          git -C target/third_party/connectivity checkout --quiet "$GIST_REV"
          rm -rf target/third_party/connectivity/.git
          cp target/third_party/connectivity/ConnectivityAndInternetAccess.java \
             target/app/src/main/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java

          cat > target/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rodrigosambade.atomicwatch'
              compileSdkVersion 35

              defaultConfig {
                  applicationId "com.rodrigosambade.atomicwatch"
                  minSdkVersion 16
                  targetSdkVersion 35
                  versionCode 1
                  versionName "1.0.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'com.android.support:appcompat-v7:28.0.0'
          }
          EOF

          cat > target/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_atomic_clock"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > target/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="background">#F4F7FA</color>
              <color name="surface">#FFFFFF</color>
              <color name="primary">#102A43</color>
              <color name="primary_dark">#0B1F33</color>
              <color name="accent">#00796B</color>
              <color name="text_primary">#102A43</color>
              <color name="text_secondary">#52606D</color>
              <color name="ok">#1B7F5A</color>
              <color name="warning">#A65F00</color>
              <color name="error">#B3261E</color>
          </resources>
          EOF

          cat > target/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">@color/primary_dark</item>
              </style>
          </resources>
          EOF

          cat > target/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Atomic Watch</string>
              <string name="title">Atomic Watch</string>
              <string name="subtitle">Hora calibrada con la API oficial de Time.is</string>
              <string name="not_synced">Sin sincronizar</string>
              <string name="sync_now">Sincronizar ahora</string>
              <string name="settings">Configurar Time.is</string>
              <string name="open_time_is">Abrir Time.is</string>
          </resources>
          EOF

          cat > target/app/src/main/res/drawable/ic_atomic_clock.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="oval">
                      <solid android:color="#102A43" />
                      <stroke android:width="2dp" android:color="#B8D8D4" />
                  </shape>
              </item>
              <item android:width="4dp" android:height="24dp" android:gravity="center">
                  <shape android:shape="rectangle"><solid android:color="#FFFFFF" /></shape>
              </item>
              <item android:width="20dp" android:height="4dp" android:gravity="center">
                  <shape android:shape="rectangle"><solid android:color="#FFFFFF" /></shape>
              </item>
          </layer-list>
          EOF

          cat > target/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true"
              android:background="@color/background">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/title"
                      android:textColor="@color/text_primary"
                      android:textSize="28sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="@string/subtitle"
                      android:textColor="@color/text_secondary"
                      android:textSize="14sp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:background="@color/surface"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <TextView
                          android:id="@+id/atomicTime"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:fontFamily="monospace"
                          android:gravity="center"
                          android:text="--:--:--.---"
                          android:textColor="@color/text_primary"
                          android:textSize="42sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/atomicDate"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:gravity="center"
                          android:text="@string/not_synced"
                          android:textColor="@color/text_secondary"
                          android:textSize="16sp" />

                      <TextView
                          android:id="@+id/utcTime"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:gravity="center"
                          android:text="UTC --:--:--.---"
                          android:textColor="@color/text_secondary"
                          android:textSize="14sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:background="@color/surface"
                      android:orientation="vertical"
                      android:padding="18dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Error del reloj del sistema"
                          android:textColor="@color/text_secondary"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/systemError"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Sin calibrar"
