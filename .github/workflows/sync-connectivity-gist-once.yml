name: One-shot exact connectivity gist sync

on:
  push:
    branches:
      - integrate-connectivity-gist-latest
    paths:
      - .github/workflows/sync-connectivity-gist-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: integrate-connectivity-gist-latest
          fetch-depth: 0

      - name: Download exact gist revision
        shell: bash
        run: |
          set -euo pipefail
          target='app/src/main/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java'
          curl --fail --silent --show-error --location 'https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/3b0497e976765653a7467e3bd7d6bff28b96bd7c/ConnectivityAndInternetAccess.java' --output "$target"
          grep -q 'public static boolean hasUnderlyingNetwork(Context context)' "$target"
          grep -q 'isEffectivelyUsable' "$target"
          grep -q 'DEFAULT_TCP_TARGETS' "$target"
          grep -q 'DEFAULT_NTP_TARGETS' "$target"
          grep -q 'DEFAULT_TLS_TARGETS' "$target"
          grep -q 'TOTAL_PROBE_TIMEOUT_MS = 6_000L' "$target"

      - name: Remove duplicate and obsolete integration sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f third_party/connectivity/ConnectivityAndInternetAccess.java
          rm -f third_party/connectivity/ConnectivityAndInternetAccess.kt
          rm -f app/src/main/java/com/rodrigosambade/atomicwatch/ConnectivityPolicy.java
          sed -i 's/ConnectivityPolicy\.isConnected(/ConnectivityAndInternetAccess.isConnected(/g' app/src/main/java/com/rodrigosambade/atomicwatch/MainActivity.java
          if grep -R -n 'ConnectivityPolicy' app/src/main/java; then
            echo 'Obsolete ConnectivityPolicy reference remains.' >&2
            exit 1
          fi

      - name: Build synchronized source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Commit synchronized integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-connectivity-gist-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sync complete connectivity gist revision'
          git push origin HEAD:integrate-connectivity-gist-latest
