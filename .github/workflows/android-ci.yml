name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Debug and Release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Verify connectivity gist integration
        run: |
          set -euo pipefail
          target="app/src/main/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java"
          test -f "$target"
          grep -q 'public static boolean hasUnderlyingNetwork(Context context)' "$target"
          grep -q 'isEffectivelyUsable' "$target"
          grep -q 'DEFAULT_TCP_TARGETS' "$target"
          grep -q 'DEFAULT_NTP_TARGETS' "$target"
          grep -q 'DEFAULT_TLS_TARGETS' "$target"
          grep -q 'TOTAL_PROBE_TIMEOUT_MS = 6_000L' "$target"
          test ! -e third_party/connectivity/ConnectivityAndInternetAccess.java
          test ! -e third_party/connectivity/ConnectivityAndInternetAccess.kt
          test ! -e app/src/main/java/com/rodrigosambade/atomicwatch/ConnectivityPolicy.java
          ! grep -R 'ConnectivityPolicy' app/src/main/java
          test -f third_party/connectivity/README.md
          test -f third_party/connectivity/LICENSE
